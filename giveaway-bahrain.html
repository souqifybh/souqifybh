<html lang="en">
<head>

<link rel="icon" href="favicon.ico" sizes="any">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<!--
  This page is intentionally standalone (separate from gift-bahrain.html).
  It does NOT fetch the product catalogue at all, only the small
  getSettings payload, so it loads essentially instantly compared to the
  main Gift to Bahrain page, and it has its own shareable URL
  (giveaway-bahrain.html, or giveaway-bahrain.html?claim=<entryId> for a
  winner's payment link). See the "GIVEAWAY LIVE - ENTER NOW" banner button
  on gift-bahrain.html, which just links here.
-->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --blush:#A5BA4A; --blush-deep:#46501B; --blush-ink:#181B09;
    --ink:#1C1C1E; --ink-soft:#6B6B70; --paper:#FFFFFF; --paper-soft:#FDF7F7;
    --line:#EFE4E4; --radius:16px; --shadow-sm:0 2px 10px rgba(28,28,30,0.06);
    --shadow-md:0 14px 40px rgba(28,28,30,0.10); --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  button{font-family:inherit;cursor:pointer;}

  header{position:sticky;top:0;z-index:200;background:rgba(255,255,255,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  nav.gb-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:760px;margin:0 auto;gap:14px;flex-wrap:wrap;}
  .gb-nav-left{display:flex;align-items:center;gap:9px;text-decoration:none;}
  .gb-nav-left img{width:30px;height:30px;border-radius:8px;}
  .gb-word{font-family:'Jost',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.03em;color:var(--ink);}
  .back-link{font-size:13.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--ink);}
  .cur-toggle{display:flex;background:var(--paper-soft);border-radius:20px;padding:4px;border:1px solid var(--line);}
  .cur-toggle button{border:none;background:none;padding:7px 14px;border-radius:16px;font-weight:800;font-size:12.5px;color:var(--ink-soft);}
  .cur-toggle button.active{background:var(--blush-deep);color:#fff;}

  .gwy-hero{background:linear-gradient(135deg,#FFD166,#F4A261 55%,#E85D75);color:#2b1400;padding:30px 24px 26px;text-align:center;border-radius:0 0 28px 28px;}
  .gwy-hero .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.55);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;padding:6px 14px;border-radius:20px;margin-bottom:12px;}
  .gwy-hero .gwy-hero-img{width:150px;height:150px;border-radius:18px;object-fit:cover;margin:0 auto 14px;box-shadow:0 10px 26px rgba(0,0,0,0.18);border:3px solid rgba(255,255,255,0.6);}
  .gwy-hero h1{font-size:clamp(21px,3.4vw,28px);margin:0 0 8px;}
  .gwy-hero p{margin:0 auto;max-width:480px;font-size:13.5px;line-height:1.6;color:#3a1c00;}
  .gwy-hero .price-row{margin-top:12px;font-weight:800;font-size:15px;}

  .gwy-body{max-width:560px;margin:0 auto;padding:26px 24px 60px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 5px;}
  input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{min-height:70px;resize:vertical;}
  .event-row{display:flex;gap:10px;}
  .event-row>div{flex:1;}
  .primary-btn{width:100%;background:var(--blush-deep);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:14.5px;margin-top:18px;}
  .primary-btn:disabled{opacity:0.5;}
  .ghost-btn{width:100%;background:none;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-weight:700;font-size:13.5px;margin-top:8px;}
  .err-msg{color:#B34141;font-size:12.5px;min-height:16px;margin-top:6px;}
  .info-box{background:var(--paper-soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}
  .step-badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--blush-deep);background:var(--paper-soft);padding:3px 10px;border-radius:20px;margin-bottom:8px;}
  .qr-box{text-align:center;margin:14px 0;}
  .qr-box img{width:180px;height:180px;object-fit:contain;margin:0 auto 10px;border:1px solid var(--line);border-radius:12px;padding:8px;}
  .whatsapp-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14.5px;margin-top:10px;text-decoration:none;display:block;text-align:center;}
  .sad-icon{font-size:44px;text-align:center;margin-bottom:6px;animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .gwy-popup-icon{font-size:48px;text-align:center;margin-bottom:8px;}
  .gpdp-share-btn{margin-top:10px;background:none;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:12px;padding:11px 16px;font-weight:700;font-size:13.5px;width:100%;cursor:pointer;}
  footer{background:var(--ink);color:#d9d5d5;padding:24px 24px;margin-top:0;text-align:center;font-size:12px;}
  footer a{color:#d9d5d5;}
  .not-open{max-width:420px;margin:60px auto;text-align:center;padding:0 24px;}
  .not-open .emoji{font-size:52px;margin-bottom:10px;}

  /* ---- confetti (used on successful entry / payment) ---- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden;}
  .confetti-piece{position:absolute;top:-40px;will-change:transform,opacity;animation:confetti-fall linear forwards;}
  @keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(112vh) rotate(560deg);opacity:0.85;}}

  /* ---- falling "GIVEAWAY" paper strips shown for 5s on page landing ---- */
  .paper-fall-layer{position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden;}
  .paper-strip{
    position:absolute;top:-60px;padding:6px 14px;border-radius:6px;
    background:linear-gradient(120deg,#FFD166,#F4A261,#E85D75);
    color:#181B09;font-family:'Sora',sans-serif;font-weight:800;font-size:13px;
    letter-spacing:0.04em;box-shadow:0 6px 14px rgba(0,0,0,0.18);
    will-change:transform,opacity;animation:paper-fall linear forwards;
    transform-origin:center;
  }
  @keyframes paper-fall{
    0%{transform:translateY(-8vh) rotate(var(--rot-start,0deg));opacity:1;}
    100%{transform:translateY(115vh) rotate(var(--rot-end,360deg));opacity:0.9;}
  }
  @media (prefers-reduced-motion: reduce){
    .paper-fall-layer{display:none;}
  }
</style>
</head>
<body>

<!-- Falling "GIVEAWAY" paper strips, shown for 5 seconds right after landing on this page -->
<div class="paper-fall-layer" id="paperFallLayer"></div>

<header>
  <nav class="gb-nav">
    <a href="gift-bahrain.html" class="gb-nav-left">
      <img src="assets/logo-mark.png" alt="Souqify-bh" onerror="this.style.display='none'">
      <span class="gb-word">Souqify-bh</span>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="cur-toggle" id="curToggle">
        <button id="curBtnINR" class="active" onclick="setCurrency('INR')">₹ INR</button>
        <button id="curBtnBHD" onclick="setCurrency('BHD')">BHD</button>
      </div>
      <a class="back-link" href="gift-bahrain.html">← Gift to Bahrain</a>
    </div>
  </nav>
</header>

<div id="giveawayEnabledView" style="display:none;">
  <section class="gwy-hero">
    <span class="badge">🎉 100% free to enter</span>
    <img class="gwy-hero-img" id="gwyHeroImg" src="" alt="Giveaway hamper">
    <h1 id="gwyHeroName">Birthday &amp; Anniversary Hamper Giveaway</h1>
    <p id="gwyHeroDesc"></p>
    <div class="price-row">Entering is free · winner pays <span id="gwyHeroPrice">-</span></div>
  </section>

  <div class="gwy-body" id="gwyBody">
    <!-- filled by JS: entry form, claim/payment step, or confirmation -->
  </div>
</div>

<div class="not-open" id="giveawayNotOpenView" style="display:none;">
  <div class="emoji">🎁</div>
  <h2>No giveaway is live right now</h2>
  <p style="color:var(--ink-soft);font-size:13.5px;">Check back soon, or send an affordable hamper to Bahrain today.</p>
  <a class="primary-btn" style="display:block;text-decoration:none;text-align:center;" href="gift-bahrain.html">Send a hamper to Bahrain</a>
</div>

<footer>
  &copy; Souqify-bh &middot; <a href="gift-bahrain.html">Gift to Bahrain</a> &middot; <a href="index.html">Main store</a>
</footer>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbw3Qt1WWluoc0nP0mfTHx3AGvMOrsqwsBvTZm-9RL4iJ947YJEVViOgx-YFUJNc9zo1/exec'
};
const WHATSAPP_NUMBER = '97335184023';

let CURRENCY = 'INR';
let SETTINGS_CACHE = {};
let ACTIVE_GIVEAWAY_ENTRY = null; // { entryId, currency, amount } once claiming

function escapeHtml(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isTrueVal(v){ return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1'; }
function fmtMoney(n){
  n = Number(n) || 0;
  return CURRENCY === 'INR' ? ('₹' + n.toLocaleString('en-IN')) : (n.toFixed(3) + ' BHD');
}
function giveawayPriceValue(){
  const raw = CURRENCY === 'INR' ? SETTINGS_CACHE.giveawayPriceINR : SETTINGS_CACHE.giveawayPriceBHD;
  const n = Number(raw);
  if(n > 0) return n;
  return CURRENCY === 'INR' ? 149 : 0.7;
}
function giveawayShortDescValue(){
  const short = (SETTINGS_CACHE.giveawayHamperShortDesc || '').trim();
  if(short) return short;
  const long = (SETTINGS_CACHE.giveawayHamperDesc || '').trim();
  if(!long) return 'Enter for free for a chance to win this hamper. One lucky winner is picked at random.';
  return long.length > 140 ? long.slice(0, 140).trim() + '…' : long;
}
function setCurrency(c){
  CURRENCY = c;
  document.getElementById('curBtnINR').classList.toggle('active', c === 'INR');
  document.getElementById('curBtnBHD').classList.toggle('active', c === 'BHD');
  renderHero();
  // If the entry form is currently shown (not mid-claim), refresh its price text
  if(!ACTIVE_GIVEAWAY_ENTRY && !getClaimEntryId()) renderEntryFormStep();
}

function getClaimEntryId(){
  return new URLSearchParams(location.search).get('claim');
}

/* ---------------- confetti (entry / payment success) ---------------- */
function triggerCelebration(){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const pieces = ['🎉','🎊','🍬','🍫','🎈','✨','🍭','🧁'];
  for(let i=0;i<44;i++){
    const span = document.createElement('span');
    span.className = 'confetti-piece';
    span.textContent = pieces[Math.floor(Math.random()*pieces.length)];
    span.style.left = Math.random()*100 + 'vw';
    span.style.fontSize = (16 + Math.random()*16) + 'px';
    span.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    span.style.animationDelay = (Math.random()*0.5) + 's';
    layer.appendChild(span);
  }
  setTimeout(() => layer.remove(), 4200);
}

/* ---------------- falling "GIVEAWAY" paper strips on landing (5s) ---------------- */
function runPaperFall(){
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReducedMotion) return;
  const layer = document.getElementById('paperFallLayer');
  const count = 26;
  for(let i=0;i<count;i++){
    const strip = document.createElement('div');
    strip.className = 'paper-strip';
    strip.textContent = 'GIVEAWAY';
    strip.style.left = Math.random()*96 + 'vw';
    strip.style.setProperty('--rot-start', (Math.random()*60 - 30) + 'deg');
    strip.style.setProperty('--rot-end', (Math.random()*720 - 360) + 'deg');
    strip.style.animationDuration = (3.4 + Math.random()*1.4) + 's';
    strip.style.animationDelay = (Math.random()*1.6) + 's';
    layer.appendChild(strip);
  }
  // Everything is done falling well within 5s of landing; clear the layer at 5s.
  setTimeout(() => { layer.innerHTML = ''; }, 5000);
}

/* ---------------- hero ---------------- */
function renderHero(){
  document.getElementById('gwyHeroName').textContent = SETTINGS_CACHE.giveawayHamperName || 'Birthday & Anniversary Hamper Giveaway';
  document.getElementById('gwyHeroDesc').textContent = giveawayShortDescValue();
  document.getElementById('gwyHeroImg').src = SETTINGS_CACHE.giveawayHamperImage || 'https://placehold.co/700x700/FDF7F7/8A3B3B?text=Giveaway';
  document.getElementById('gwyHeroPrice').textContent = fmtMoney(giveawayPriceValue());
}

/* ---------------- date helpers (mirrors gift-bahrain.html) ---------------- */
// The giveaway winner is announced on 30 Sep 2026, so no delivery date on
// or before that day can be picked at entry time (nobody could receive
// their hamper before a winner even exists yet). The calendar's earliest
// selectable day is therefore 1 Oct 2026, unless the normal "at least 2
// days from today" lead-time rule ever pushes later than that (e.g. once
// 30 Sep 2026 has already passed) — in that case the later of the two
// wins, same as before.
const GIVEAWAY_WINNER_ANNOUNCE_DATE = new Date(2026, 8, 30); // 30 Sep 2026 (month is 0-indexed)
function minGiftDeliveryDate(){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 2);

  const earliestAfterAnnouncement = new Date(GIVEAWAY_WINNER_ANNOUNCE_DATE);
  earliestAfterAnnouncement.setHours(0,0,0,0);
  earliestAfterAnnouncement.setDate(earliestAfterAnnouncement.getDate() + 1); // 1 Oct 2026

  return d > earliestAfterAnnouncement ? d : earliestAfterAnnouncement;
}
function isoDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(d){
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

/* ================= GIVEAWAY ENTRY (100% free) ================= */
function renderEntryFormStep(){
  const minDate = minGiftDeliveryDate();
  const minDateISO = isoDate(minDate);
  const minDateLabel = prettyDate(minDate);
  const price = giveawayPriceValue();
  document.getElementById('gwyBody').innerHTML = `
    <span class="step-badge">🎉 Free giveaway entry</span>
    <h2 style="margin:0 0 6px;">Enter the giveaway. It's free</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 6px;">One winner is picked at random from everyone who enters. Entering costs nothing. If you're picked, we'll email you a link to pay just for the hamper (${fmtMoney(price)}) so we can deliver it to the address below.</p>

    <label>Your name</label><input type="text" id="gwSenderName">
    <label>Your email <span style="font-weight:500;color:var(--ink-soft);">(so we can reach you if you win)</span></label><input type="email" id="gwSenderEmail">
    <label>Your phone</label><input type="tel" id="gwSenderPhone">
    <label>Delivery address in Bahrain <span style="font-weight:500;color:var(--ink-soft);">(used only if you win)</span></label><textarea id="gwAddress"></textarea>

    <label>🎉 Occasion</label>
    <select id="gwEventType">
      <option value="Birthday">🎂 Birthday</option>
      <option value="Anniversary">💍 Anniversary</option>
    </select>

    <label>Preferred delivery date</label>
    <div class="event-row">
      <div><label style="margin-top:0;">Date</label><input type="date" id="gwDeliveryDate" min="${minDateISO}"></div>
      <div>
        <label style="margin-top:0;">Time slot</label>
        <select id="gwDeliveryTime">
          <option value="">Choose a time</option>
          <option value="Morning (9am–12pm)">Morning (9am–12pm)</option>
          <option value="Afternoon (12pm–4pm)">Afternoon (12pm–4pm)</option>
          <option value="Evening (4pm–8pm)">Evening (4pm–8pm)</option>
          <option value="Night (8pm–10pm)">Night (8pm–10pm)</option>
        </select>
      </div>
    </div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:4px;">Only used if you're picked as the winner. The earliest date you can pick is ${minDateLabel}.</div>

    <div class="info-box" style="text-align:center;font-weight:800;color:#1E7A44;background:#EAF7EE;">Entry fee: FREE</div>
    <div id="gwDetailsErr" class="err-msg"></div>
    <button class="primary-btn" onclick="submitGiveawayDetails()">Enter for free</button>
  `;
}

async function submitGiveawayDetails(){
  const customerName = document.getElementById('gwSenderName').value.trim();
  const customerEmail = document.getElementById('gwSenderEmail').value.trim();
  const phone = document.getElementById('gwSenderPhone').value.trim();
  const address = document.getElementById('gwAddress').value.trim();
  const eventType = document.getElementById('gwEventType').value;
  const deliveryDate = document.getElementById('gwDeliveryDate').value;
  const deliveryTimeSlot = document.getElementById('gwDeliveryTime').value;
  const errBox = document.getElementById('gwDetailsErr');

  if(!customerName || !customerEmail || !phone){ errBox.textContent = 'Please fill in your name, email and phone.'; return; }
  if(!address){ errBox.textContent = 'Please fill in your delivery address.'; return; }
  if(!deliveryDate){ errBox.textContent = 'Please choose a preferred delivery date.'; return; }
  const minDate = minGiftDeliveryDate();
  const chosenDate = new Date(deliveryDate + 'T00:00:00');
  if(isNaN(chosenDate.getTime()) || chosenDate < minDate){
    errBox.textContent = `Please choose a date on or after ${prettyDate(minDate)}.`;
    return;
  }
  if(!deliveryTimeSlot){ errBox.textContent = 'Please choose a delivery time slot.'; return; }
  errBox.textContent = '';

  const payload = {
    action: 'createGiveawayEntry',
    customerName, customerEmail, phone, address,
    eventType, deliveryDate, deliveryTimeSlot, currency: CURRENCY
  };
  document.getElementById('gwyBody').innerHTML = '<p style="text-align:center;padding:40px 0;">Submitting your free entry…</p>';
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if(!data.ok){ renderEntryFormStep(); document.getElementById('gwDetailsErr').textContent = data.error || 'Could not create the entry.'; return; }
    renderGiveawayEnteredConfirmation(data.entryId);
  }catch(e){
    renderEntryFormStep();
    document.getElementById('gwDetailsErr').textContent = 'Network error. Please try again.';
  }
}

function renderGiveawayEnteredConfirmation(entryId){
  document.getElementById('gwyBody').innerHTML = `
    <div class="gwy-popup-icon">🎉</div>
    <h2 style="text-align:center;margin:0 0 8px;">You're entered. For free!</h2>
    <p style="text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.6;">
      Entry <b>${escapeHtml(entryId)}</b> is confirmed and didn't cost a thing. We've also emailed you a confirmation.
      If you're picked as our lucky winner, we'll email you personally with a link to pay just for the hamper itself
      so we can arrange delivery.
    </p>
    <a class="primary-btn" style="display:block;text-decoration:none;text-align:center;" href="gift-bahrain.html">Browse hampers</a>
    <button class="gpdp-share-btn" onclick="shareGiveaway(event)">🔗 Share this giveaway with friends &amp; family</button>
  `;
  triggerCelebration();
}

function giveawayShareUrl(){
  return `${location.origin}${location.pathname}`;
}
async function shareGiveaway(e){
  if(e) e.stopPropagation();
  const url = giveawayShareUrl();
  const name = SETTINGS_CACHE.giveawayHamperName || 'this giveaway';
  const shareText = `Enter for free to win ${name}!`;
  if(navigator.share){
    try{ await navigator.share({ title: shareText, text: shareText, url }); return; }catch(err){ /* cancelled or unsupported, fall through to copy */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    alert('Giveaway link copied! Share it with friends and family.');
  }catch(err){
    prompt('Copy this link to share the giveaway:', url);
  }
}

/* ================= GIVEAWAY. CLAIM YOUR PRIZE (winner pays) =================
 * Reached ONLY via the "claim your hamper" link the winner-notification
 * email sends: giveaway-bahrain.html?claim=<entryId>. Every server call
 * here (getGiveawayEntryStatus / createGiveawayRazorpayOrder /
 * verifyGiveawayPayment / submitGiveawayBenefitPayProof) independently
 * re-checks that this entry was actually picked as the winner, so this
 * link only ever does anything for the one real winner.
 */
async function openGiveawayClaim(entryId){
  document.getElementById('gwyBody').innerHTML = '<p style="text-align:center;padding:40px 0;">Checking your entry…</p>';
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ action:'getGiveawayEntryStatus', entryId }) });
    const data = await res.json();
    if(!data.ok){
      document.getElementById('gwyBody').innerHTML = `
        <h2 style="margin:0 0 8px;">Hmm, that link isn't valid</h2>
        <p style="color:var(--ink-soft);font-size:13.5px;">${escapeHtml(data.error || 'This entry could not be found.')} If you believe you won, please message us on WhatsApp.</p>
        <a class="whatsapp-btn" target="_blank" href="https://wa.me/${WHATSAPP_NUMBER}">Message us on WhatsApp</a>
      `;
      return;
    }
    // Use the entry's own currency (set when they entered) for the payment step.
    CURRENCY = data.currency === 'BHD' ? 'BHD' : 'INR';
    document.getElementById('curBtnINR').classList.toggle('active', CURRENCY === 'INR');
    document.getElementById('curBtnBHD').classList.toggle('active', CURRENCY === 'BHD');
    ACTIVE_GIVEAWAY_ENTRY = { entryId: data.id, currency: data.currency, amount: data.amount };
    if(data.paymentStatus === 'paid'){
      document.getElementById('gwyBody').innerHTML = `
        <div class="gwy-popup-icon">🎁</div>
        <h2 style="text-align:center;margin:0 0 8px;">You're all set!</h2>
        <p style="text-align:center;color:var(--ink-soft);font-size:13.5px;">Your payment for entry ${escapeHtml(data.id)} is already confirmed. We'll be in touch to arrange delivery.</p>
      `;
      return;
    }
    if(data.currency === 'INR') renderGiveawayClaimRazorpayStep(data);
    else renderGiveawayClaimBenefitPayStep(data);
  }catch(e){
    document.getElementById('gwyBody').innerHTML = '<p style="text-align:center;padding:40px 0;color:#B34141;">Network error. Please refresh and try again.</p>';
  }
}
function renderGiveawayClaimRazorpayStep(data){
  document.getElementById('gwyBody').innerHTML = `
    <div class="gwy-popup-icon">🏆</div>
    <h2 style="margin:0 0 6px;text-align:center;">Congratulations, ${escapeHtml((data.customerName||'').split(' ')[0] || 'winner')}!</h2>
    <p style="color:var(--ink-soft);font-size:13px;text-align:center;">Pay ${fmtMoney(data.amount)} to claim your hamper for entry ${escapeHtml(data.id)}. We'll arrange delivery right after.</p>
    <button class="primary-btn" id="gwClaimPayBtn" onclick="startGiveawayClaimRazorpayPayment()">Pay ${fmtMoney(data.amount)} to claim</button>
    <div id="gwClaimFailBox" style="display:none;">
      <div class="sad-icon">😢</div>
      <h3 style="text-align:center;margin:0 0 6px;">That payment didn't go through!</h3>
      <div class="info-box" style="color:#B34141;background:#FCEEEE;text-align:center;">Let's give it another try.</div>
      <button class="ghost-btn" onclick="startGiveawayClaimRazorpayPayment()">Retry payment</button>
    </div>
  `;
}
async function startGiveawayClaimRazorpayPayment(){
  document.getElementById('gwClaimFailBox').style.display = 'none';
  document.getElementById('gwClaimPayBtn').textContent = 'Opening payment…';
  try{
    const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ action:'createGiveawayRazorpayOrder', entryId: ACTIVE_GIVEAWAY_ENTRY.entryId }) });
    const data = await res.json();
    if(!data.ok){
      document.getElementById('gwClaimPayBtn').textContent = `Pay ${fmtMoney(ACTIVE_GIVEAWAY_ENTRY.amount)} to claim`;
      document.getElementById('gwClaimFailBox').style.display = 'block';
      return;
    }
    const rzp = new Razorpay({
      key: data.keyId,
      amount: data.amount,
      currency: data.currency,
      name: data.name,
      order_id: data.razorpayOrderId,
      handler: async function(response){
        const verifyRes = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({
          action: 'verifyGiveawayPayment', entryId: ACTIVE_GIVEAWAY_ENTRY.entryId,
          razorpay_order_id: response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature
        })});
        const verifyData = await verifyRes.json();
        if(verifyData.ok) renderGiveawayClaimPaidConfirmation();
        else document.getElementById('gwClaimFailBox').style.display = 'block';
      },
      modal: { ondismiss: function(){ document.getElementById('gwClaimFailBox').style.display = 'block'; } }
    });
    rzp.on('payment.failed', function(){ document.getElementById('gwClaimFailBox').style.display = 'block'; });
    rzp.open();
    document.getElementById('gwClaimPayBtn').textContent = `Pay ${fmtMoney(ACTIVE_GIVEAWAY_ENTRY.amount)} to claim`;
  }catch(e){
    document.getElementById('gwClaimPayBtn').textContent = `Pay ${fmtMoney(ACTIVE_GIVEAWAY_ENTRY.amount)} to claim`;
    document.getElementById('gwClaimFailBox').style.display = 'block';
  }
}
function renderGiveawayClaimBenefitPayStep(data){
  const iban = SETTINGS_CACHE.benefitpayIban || 'BH00 SOUQ 0000 0000 0000 00';
  const name = SETTINGS_CACHE.benefitpayName || 'Souqify-bh W.L.L.';
  const qr = SETTINGS_CACHE.benefitpayQrUrl || 'assets/benefitpay-qr.png';
  const waText = encodeURIComponent(
    `Hi Souqify-bh, I'm the winner of giveaway entry ${data.id} and I've paid ${fmtMoney(data.amount)} for the hamper. Please verify and confirm.`
  );
  document.getElementById('gwyBody').innerHTML = `
    <div class="gwy-popup-icon">🏆</div>
    <h2 style="margin:0 0 6px;text-align:center;">Congratulations, ${escapeHtml((data.customerName||'').split(' ')[0] || 'winner')}!</h2>
    <p style="color:var(--ink-soft);font-size:13px;text-align:center;">Pay ${fmtMoney(data.amount)} via BenefitPay / IBAN to claim your hamper for entry ${escapeHtml(data.id)}.</p>
    <div class="qr-box">
      <img src="${qr}" alt="BenefitPay QR">
      <div style="font-weight:700;">${escapeHtml(name)}</div>
      <div style="font-family:monospace;font-size:13px;">${escapeHtml(iban)}</div>
    </div>
    <a class="whatsapp-btn" target="_blank"
       href="https://wa.me/${WHATSAPP_NUMBER}?text=${waText}" onclick="markGiveawayClaimBenefitPaySubmitted()">
       ✅ I've paid. Notify us on WhatsApp
    </a>
    <div class="info-box">Your claim is reserved and will show as "awaiting verification" until we confirm your payment.</div>
  `;
}
async function markGiveawayClaimBenefitPaySubmitted(){
  try{
    await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ action:'submitGiveawayBenefitPayProof', entryId: ACTIVE_GIVEAWAY_ENTRY.entryId }) });
  }catch(e){}
  setTimeout(renderGiveawayClaimPaidConfirmation, 400);
}
function renderGiveawayClaimPaidConfirmation(){
  document.getElementById('gwyBody').innerHTML = `
    <div class="gwy-popup-icon">🎁</div>
    <h2 style="text-align:center;margin:0 0 8px;">Thank you!</h2>
    <p style="text-align:center;color:var(--ink-soft);font-size:13.5px;">We've received your claim for entry ${escapeHtml(ACTIVE_GIVEAWAY_ENTRY.entryId)}. We'll be in touch shortly to arrange delivery of your hamper.</p>
  `;
  triggerCelebration();
}

/* ---------------- boot ---------------- */
async function loadSettingsAndBoot(){
  // Cache-first render so the hero/entry form appear instantly on repeat
  // visits, while the fresh settings load in the background.
  try{
    const cached = sessionStorage.getItem('giftSettingsCache');
    if(cached) SETTINGS_CACHE = JSON.parse(cached);
  }catch(e){}

  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getSettings`);
    const data = await res.json();
    if(data.ok){
      SETTINGS_CACHE = data.settings || {};
      try{ sessionStorage.setItem('giftSettingsCache', JSON.stringify(SETTINGS_CACHE)); }catch(e){}
    }
  }catch(e){}

  if(!isTrueVal(SETTINGS_CACHE.giveawayEnabled)){
    document.getElementById('giveawayEnabledView').style.display = 'none';
    document.getElementById('giveawayNotOpenView').style.display = 'block';
    return;
  }
  document.getElementById('giveawayEnabledView').style.display = 'block';
  document.getElementById('giveawayNotOpenView').style.display = 'none';
  renderHero();

  const claimId = getClaimEntryId();
  if(claimId) openGiveawayClaim(claimId);
  else renderEntryFormStep();
}

runPaperFall(); // fires immediately on landing, runs for ~5 seconds
loadSettingsAndBoot();
</script>
</body>
</html>
