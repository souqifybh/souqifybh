<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Sora','Inter',sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DEE8B4"/>
      <stop offset="55%" stop-color="#D2DE9C"/>
      <stop offset="100%" stop-color="#C7D687"/>
    </linearGradient>
    <radialGradient id="glowD" cx="82%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circleD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7E8"/>
    </linearGradient>
    <linearGradient id="cabD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7A2E"/>
      <stop offset="100%" stop-color="#4B5620"/>
    </linearGradient>
    <filter id="cardShadowD" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7C8F35" flood-opacity="0.28"/>
    </filter>
    <filter id="btnShadowD" x="-40%" y="-60%" width="180%" height="260%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4B5620" flood-opacity="0.22"/>
    </filter>
    <clipPath id="clipD"><rect width="1200" height="300" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clipD)">
    <rect width="1200" height="300" fill="url(#bgD)"/>
    <rect width="1200" height="300" fill="url(#glowD)"/>
    <circle cx="1050" cy="40" r="130" fill="#FFFFFF" opacity="0.07"/>
    <circle cx="1160" cy="260" r="100" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="40" cy="270" r="80" fill="#FFFFFF" opacity="0.08"/>
    <line x1="0" y1="0" x2="1200" y2="300" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="240"/>
    <rect x="1.5" y="1.5" width="1197" height="297" rx="24.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <g filter="url(#cardShadowD)">
    <ellipse cx="112" cy="214" rx="52" ry="11" fill="#4B5620" opacity="0.16"/>
    <circle cx="112" cy="150" r="66" fill="url(#circleD)" stroke="#FFFFFF" stroke-width="2"/>
    <g transform="translate(112,150)">
      <!-- truck body -->
      <rect x="-38" y="-14" width="46" height="30" rx="4" fill="url(#cabD)"/>
      <path d="M8 -6h15l11 12v8h-26z" fill="url(#cabD)"/>
      <rect x="11" y="-3" width="10" height="8" rx="1.2" fill="#EAF0CE"/>
      <rect x="-38" y="-20" width="46" height="6" rx="3" fill="#EAF0CE" opacity="0.85"/>
      <!-- wheels -->
      <circle cx="-24" cy="18" r="8" fill="#2A2A2E"/>
      <circle cx="-24" cy="18" r="3.2" fill="#FFFFFF"/>
      <circle cx="18" cy="18" r="8" fill="#2A2A2E"/>
      <circle cx="18" cy="18" r="3.2" fill="#FFFFFF"/>
      <!-- speed lines -->
      <line x1="-58" y1="-8" x2="-46" y2="-8" stroke="#4B5620" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      <line x1="-54" y1="0" x2="-46" y2="0" stroke="#4B5620" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    </g>
  </g>

  <text x="222" y="92" font-size="14" font-weight="700" fill="#4B5620" letter-spacing="2.4" opacity="0.75">DELIVERY PROMISE</text>
  <text x="222" y="136" font-size="38" font-weight="800" fill="#242B0E" letter-spacing="-0.3">Free &amp; One-Day Delivery</text>
  <text x="222" y="172" font-size="21" font-weight="500" fill="#46501B">Order today and get it delivered</text>
  <text x="222" y="199" font-size="21" font-weight="500" fill="#46501B">tomorrow, anywhere in Bahrain.</text>

  <g filter="url(#btnShadowD)" transform="translate(1040,150)">
    <rect x="-122" y="-30" width="244" height="60" rx="30" fill="#FFFFFF"/>
    <g transform="translate(-92,0) scale(0.85)">
      <rect x="-14" y="-9" width="18" height="13" rx="2" fill="#4B5620"/>
      <path d="M4 -3h7l5 6v6h-12z" fill="#4B5620"/>
      <circle cx="-9" cy="8" r="3.6" fill="#242B0E"/>
      <circle cx="8" cy="8" r="3.6" fill="#242B0E"/>
    </g>
    <text x="-58" y="6" font-size="20" font-weight="800" fill="#4B5620">All Over Bahrain</text>
  </g>
</svg>
